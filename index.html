<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Mitr:wght@400;600&display=swap">
<style>
/* Layout: one-screen arcade column — score header, 8x8 board, three-piece tray. Deliberately single dark theme (night-blue arcade). */
:root {
  --bg-top: #2a3f9e;
  --bg-bottom: #121d57;
  --board: #0e1746;
  --slot: #1b2868;
  --ink: #f4f6ff;
  --ink-soft: #a9b5ec;
  --gold: #ffcf3a;
  --display: "Lilita One", "Mitr", system-ui, sans-serif;
  --body: "Mitr", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  background-color: var(--bg-bottom);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-inline: 16px;
  padding-block: 12px;
  box-sizing: border-box;
  gap: 8px;
}
header {
  width: 100%;
  max-width: 460px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
}
.best {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--display); font-size: 20px; color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.best svg { width: 24px; height: 24px; }
.score-wrap { text-align: center; }
.score {
  font-family: var(--display);
  font-size: 52px; line-height: 1;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 3px 0 rgba(0,0,0,.25);
  transition: transform .15s;
}
.score.bump { transform: scale(1.12); }
.tools { display: flex; justify-content: flex-end; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 0;
  background: rgba(255,255,255,.12); color: var(--ink);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn:hover { background: rgba(255,255,255,.2); }
.icon-btn:focus-visible, .play:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.icon-btn svg { width: 22px; height: 22px; }
canvas { display: block; touch-action: none; }
.hint { color: var(--ink-soft); font-size: 13px; text-align: center; }

.overlay {
  position: fixed; inset: 0;
  background: rgba(8, 12, 40, .72);
  display: grid; place-items: center;
  padding-inline: 16px;
  z-index: 10;
}
.card {
  background: linear-gradient(180deg, #33489f, #1c2a6e);
  border-radius: 24px;
  padding: 28px 24px;
  width: min(340px, 100%);
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 6px;
  animation: pop .35s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card h2 { margin: 0; font-family: var(--body); font-weight: 600; font-size: 26px; }
.card .label { color: var(--ink-soft); font-size: 14px; letter-spacing: .04em; margin-top: 10px; }
.card .big { font-family: var(--display); font-size: 56px; line-height: 1; }
.card .bestline { font-family: var(--display); font-size: 22px; color: var(--gold); }
.card .newbest { color: var(--gold); font-weight: 600; }
.play {
  margin-top: 18px;
  border: 0; border-radius: 16px;
  padding: 14px 20px;
  font-family: var(--body); font-weight: 600; font-size: 20px;
  color: #3a2400;
  background: linear-gradient(180deg, #ffe066, #ffb703);
  box-shadow: 0 5px 0 #c77d00;
  cursor: pointer;
}
.play:active { transform: translateY(3px); box-shadow: 0 2px 0 #c77d00; }
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .score { transition: none; }
}
</style>

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <header>
    <div class="best" title="คะแนนสูงสุด">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7z"/></svg>
      <span id="best">0</span>
    </div>
    <div class="score-wrap"><div class="score" id="score">0</div></div>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" aria-label="ปิด/เปิดเสียง">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="soundIcon"></svg>
      </button>
      <button class="icon-btn" id="restartBtn" aria-label="เริ่มเกมใหม่">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
      </button>
    </div>
  </header>
  <canvas id="game"></canvas>
  <div class="hint">ลากบล็อกลงกระดาน เติมแถวหรือคอลัมน์ให้เต็มเพื่อเคลียร์</div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="goTitle">
    <h2 id="goTitle">ไม่มีที่วางแล้ว!</h2>
    <div class="label">คะแนน</div>
    <div class="big" id="finalScore">0</div>
    <div class="newbest" id="newBest" hidden>สถิติใหม่!</div>
    <div class="label">คะแนนสูงสุด</div>
    <div class="bestline" id="finalBest">0</div>
    <button class="play" id="playAgain">เล่นใหม่</button>
  </div>
</div>

<script>
(() => {
const N = 8;
const COLORS = [
  { base: "#ff4d5e", light: "#ff8e98", dark: "#c11f33" }, // red
  { base: "#ff9a2e", light: "#ffc27a", dark: "#cc6a00" }, // orange
  { base: "#ffd23a", light: "#ffe98e", dark: "#c99a00" }, // yellow
  { base: "#4cd964", light: "#93ec9f", dark: "#22a03a" }, // green
  { base: "#2ed1e8", light: "#86e8f4", dark: "#0b97ad" }, // cyan
  { base: "#3d7bff", light: "#86abff", dark: "#1b4fcc" }, // blue
  { base: "#a35bff", light: "#c99bff", dark: "#7128d1" }, // purple
];

// [shape rows, weight]
const SHAPE_DEFS = [
  [["#"], 3],
  [["##"], 4], [["#","#"], 4],
  [["###"], 4], [["#","#","#"], 4],
  [["####"], 3], [["#","#","#","#"], 3],
  [["#####"], 2], [["#","#","#","#","#"], 2],
  [["##","##"], 6],
  [["###","###","###"], 2],
  [["##","##","##"], 2], [["###","###"], 2],
  [["#.","##"], 3], [["##","#."], 3], [["##",".#"], 3], [[".#","##"], 3],
  [["#..","#..","###"], 2], [["###","#..","#.."], 2], [["###","..#","..#"], 2], [["..#","..#","###"], 2],
  [["#.","#.","##"], 2], [[".#",".#","##"], 2], [["##","#.","#."], 2], [["##",".#",".#"], 2],
  [["###","#.."], 2], [["###","..#"], 2], [["#..","###"], 2], [["..#","###"], 2],
  [["###",".#."], 2], [[".#.","###"], 2], [["#.","##","#."], 2], [[".#","##",".#"], 2],
  [[".##","##."], 2], [["##.",".##"], 2], [["#.","##",".#"], 2], [[".#","##","#."], 2],
  [["#.",".#"], 1], [[".#","#."], 1],
];
const SHAPES = SHAPE_DEFS.map(([rows, w]) => {
  const cells = [];
  rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === "#") cells.push([r, c]); }));
  return { cells, w: rows[0].length, h: rows.length, weight: w };
});
const TOTAL_W = SHAPES.reduce((s, x) => s + x.weight, 0);

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("overlay");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

let grid, tray, score, shownScore, best, combo, movesSinceClear, over;
let drag = null;
let clearing = [];   // {r,c,color,t0}
let particles = [];
let floaters = [];   // {text,x,y,t0,color,size}
let shake = 0;
let L = {};          // layout
let soundOn = true;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ---------- sound ---------- */
let actx = null;
function tone(freq, dur, type = "sine", vol = 0.15, delay = 0) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  pick() { tone(520, .06, "triangle", .08); },
  place() { tone(220, .09, "square", .06); tone(330, .08, "triangle", .08, .02); },
  clear(n) { [523, 659, 784, 988, 1175].slice(0, Math.min(5, 2 + n)).forEach((f, i) => tone(f, .18, "triangle", .12, i * .06)); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, .3, "sawtooth", .06, i * .15)); },
};
function drawSoundIcon() {
  document.getElementById("soundIcon").innerHTML = soundOn
    ? '<path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'
    : '<path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>';
}

/* ---------- game logic ---------- */
function randomPiece() {
  let x = Math.random() * TOTAL_W, s = SHAPES[0];
  for (const sh of SHAPES) { x -= sh.weight; if (x <= 0) { s = sh; break; } }
  return { ...s, color: Math.floor(Math.random() * COLORS.length) };
}
function canPlace(p, r, c, g = grid) {
  for (const [dr, dc] of p.cells) {
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || cc < 0 || rr >= N || cc >= N || g[rr][cc] !== null) return false;
  }
  return true;
}
function fitsAnywhere(p) {
  for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (canPlace(p, r, c)) return true;
  return false;
}
function newTray() {
  let t;
  for (let tries = 0; tries < 40; tries++) {
    t = [randomPiece(), randomPiece(), randomPiece()];
    if (t.some(fitsAnywhere)) break;
  }
  tray = t;
}
function fullLines(g) {
  const rows = [], cols = [];
  for (let i = 0; i < N; i++) {
    if (g[i].every(v => v !== null)) rows.push(i);
    if (g.every(row => row[i] !== null)) cols.push(i);
  }
  return { rows, cols };
}
function newGame() {
  grid = Array.from({ length: N }, () => Array(N).fill(null));
  score = 0; shownScore = 0; combo = 0; movesSinceClear = 0; over = false;
  clearing = []; particles = []; floaters = [];
  newTray();
  overlay.hidden = true;
  updateHud();
}

function place(i, r, c) {
  const p = tray[i];
  for (const [dr, dc] of p.cells) grid[r + dr][c + dc] = p.color;
  tray[i] = null;
  let gain = p.cells.length;

  const { rows, cols } = fullLines(grid);
  const lines = rows.length + cols.length;
  const now = performance.now();
  if (lines > 0) {
    combo++;
    movesSinceClear = 0;
    const seen = new Set();
    const mark = (rr, cc) => {
      const k = rr * N + cc;
      if (seen.has(k)) return;
      seen.add(k);
      const dist = Math.abs(rr - (r + p.h / 2)) + Math.abs(cc - (c + p.w / 2));
      clearing.push({ r: rr, c: cc, color: p.color, t0: now + dist * 25 });
    };
    rows.forEach(rr => { for (let cc = 0; cc < N; cc++) mark(rr, cc); });
    cols.forEach(cc => { for (let rr = 0; rr < N; rr++) mark(rr, cc); });
    seen.forEach(k => { grid[Math.floor(k / N)][k % N] = null; });

    let lineScore = 80 * lines + 40 * lines * (lines - 1);
    lineScore = Math.round(lineScore * (1 + 0.5 * (combo - 1)));
    gain += lineScore;

    const cx = L.boardX + (c + p.w / 2) * L.cell;
    const cy = L.boardY + (r + p.h / 2) * L.cell;
    const words = ["", "Good!", "Great!", "Excellent!", "Amazing!", "Unbelievable!"];
    if (lines >= 2) floaters.push({ text: words[Math.min(lines, 5)], x: L.boardX + L.boardSize / 2, y: L.boardY + L.boardSize * 0.38, t0: now, color: "#ffcf3a", size: L.cell * 0.9 });
    if (combo >= 2) floaters.push({ text: "Combo x" + combo, x: L.boardX + L.boardSize / 2, y: L.boardY + L.boardSize * 0.52, t0: now + 80, color: "#7ff0ff", size: L.cell * 0.62 });
    floaters.push({ text: "+" + gain, x: cx, y: cy, t0: now, color: "#ffffff", size: L.cell * 0.55 });

    if (grid.every(row => row.every(v => v === null))) {
      gain += 300;
      floaters.push({ text: "เคลียร์หมดกระดาน! +300", x: L.boardX + L.boardSize / 2, y: L.boardY + L.boardSize * 0.66, t0: now + 160, color: "#ffcf3a", size: L.cell * 0.5 });
    }
    shake = reduceMotion ? 0 : Math.min(14, 4 + lines * 3);
    sfx.clear(lines);
  } else {
    movesSinceClear++;
    if (movesSinceClear >= 3) combo = 0;
    sfx.place();
  }
  score += gain;
  if (score > best) { best = score; store("bb-best", String(best)); }
  updateHud(true);

  if (tray.every(x => x === null)) newTray();
  if (!tray.some(x => x && fitsAnywhere(x))) {
    over = true;
    setTimeout(showGameOver, 700);
  }
}

function showGameOver() {
  sfx.over();
  document.getElementById("finalScore").textContent = score.toLocaleString();
  document.getElementById("finalBest").textContent = best.toLocaleString();
  document.getElementById("newBest").hidden = !(score > 0 && score >= best);
  overlay.hidden = false;
  document.getElementById("playAgain").focus();
}

function updateHud(bump) {
  bestEl.textContent = best.toLocaleString();
  if (bump) {
    scoreEl.classList.add("bump");
    setTimeout(() => scoreEl.classList.remove("bump"), 150);
  }
}

/* ---------- layout ---------- */
function layout() {
  const header = document.querySelector("header").offsetHeight;
  const hint = document.querySelector(".hint").offsetHeight;
  const availH = innerHeight - header - hint - 24 - 16;
  const availW = Math.min(innerWidth - 32, 460);
  const pad = 10;
  // H = 2*pad + cell*(8 + 0.5 + 3)
  const cellByH = (availH - 2 * pad) / 11.5;
  const cellByW = (availW - 2 * pad) / 8;
  const cell = Math.max(24, Math.floor(Math.min(cellByH, cellByW)));
  const W = cell * 8 + 2 * pad;
  const H = Math.round(2 * pad + cell * 11.5);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  L = {
    W, H, pad, cell,
    boardX: pad, boardY: pad, boardSize: cell * 8,
    trayY: pad + cell * 8.5, trayH: cell * 3,
    mini: cell * 0.52,
  };
}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawBlock(x, y, s, ci, alpha = 1) {
  const col = COLORS[ci];
  const g = s * 0.04, b = s * 0.15;
  x += g; y += g; s -= g * 2;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col.base;
  ctx.fillRect(x, y, s, s);
  // top bevel
  ctx.fillStyle = col.light;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s, y); ctx.lineTo(x + s - b, y + b); ctx.lineTo(x + b, y + b); ctx.fill();
  // left bevel
  ctx.globalAlpha = alpha * 0.7;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + b, y + b); ctx.lineTo(x + b, y + s - b); ctx.lineTo(x, y + s); ctx.fill();
  // bottom + right bevel
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col.dark;
  ctx.beginPath(); ctx.moveTo(x, y + s); ctx.lineTo(x + b, y + s - b); ctx.lineTo(x + s - b, y + s - b); ctx.lineTo(x + s, y + s); ctx.fill();
  ctx.globalAlpha = alpha * 0.75;
  ctx.beginPath(); ctx.moveTo(x + s, y); ctx.lineTo(x + s, y + s); ctx.lineTo(x + s - b, y + s - b); ctx.lineTo(x + s - b, y + b); ctx.fill();
  // gloss
  ctx.globalAlpha = alpha * 0.25;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(x + b, y + b, s - 2 * b, (s - 2 * b) * 0.35);
  ctx.globalAlpha = 1;
}

function dragTarget() {
  if (!drag) return null;
  const p = drag.piece, cell = L.cell;
  const px = drag.x - (p.w * cell) / 2;
  const py = drag.y - drag.offY - (p.h * cell) / 2;
  const c = Math.round((px - L.boardX) / cell);
  const r = Math.round((py - L.boardY) / cell);
  return { r, c, px, py, ok: canPlace(p, r, c) };
}

function render(now) {
  const { W, H, cell, boardX, boardY, boardSize } = L;
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.3) {
    ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    shake *= 0.86;
  } else shake = 0;

  // board
  ctx.fillStyle = "#0e1746";
  rr(boardX - 6, boardY - 6, boardSize + 12, boardSize + 12, 12);
  ctx.fill();
  ctx.fillStyle = "#1b2868";
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillRect(boardX + c * cell + 1, boardY + r * cell + 1, cell - 2, cell - 2);
  }

  // preview: which lines would clear
  const t = dragTarget();
  let previewLines = null;
  if (t && t.ok) {
    const g2 = grid.map(row => row.slice());
    for (const [dr, dc] of drag.piece.cells) g2[t.r + dr][t.c + dc] = drag.piece.color;
    previewLines = fullLines(g2);
  }
  const inPreview = (r, c) => previewLines && (previewLines.rows.includes(r) || previewLines.cols.includes(c));

  // placed blocks
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const v = grid[r][c];
    if (v !== null) drawBlock(boardX + c * cell, boardY + r * cell, cell, inPreview(r, c) ? drag.piece.color : v);
  }

  // ghost
  if (t && t.ok) {
    for (const [dr, dc] of drag.piece.cells) {
      const r = t.r + dr, c = t.c + dc;
      drawBlock(boardX + c * cell, boardY + r * cell, cell, drag.piece.color, inPreview(r, c) ? 1 : 0.4);
    }
    if (previewLines.rows.length || previewLines.cols.length) {
      ctx.fillStyle = "rgba(255,255,255," + (0.12 + 0.08 * Math.sin(now / 120)) + ")";
      previewLines.rows.forEach(r => ctx.fillRect(boardX, boardY + r * cell, boardSize, cell));
      previewLines.cols.forEach(c => ctx.fillRect(boardX + c * cell, boardY, cell, boardSize));
    }
  }

  // clearing animation
  clearing = clearing.filter(k => {
    const e = (now - k.t0) / 280;
    if (e < 0) { drawBlock(boardX + k.c * cell, boardY + k.r * cell, cell, k.color); return true; }
    if (!k.burst) {
      k.burst = true;
      if (!reduceMotion) for (let i = 0; i < 5; i++) {
        particles.push({
          x: boardX + (k.c + .5) * cell, y: boardY + (k.r + .5) * cell,
          vx: (Math.random() - .5) * 7, vy: -Math.random() * 6 - 1,
          s: cell * (0.12 + Math.random() * 0.14), color: COLORS[k.color].light, life: 1,
        });
      }
    }
    if (e >= 1) return false;
    const s = cell * (1 - e);
    drawBlock(boardX + k.c * cell + (cell - s) / 2, boardY + k.r * cell + (cell - s) / 2, s, k.color, 1 - e * 0.5);
    return true;
  });

  // tray
  const slotW = W / 3;
  tray.forEach((p, i) => {
    if (!p || (drag && drag.i === i)) return;
    const m = L.mini;
    const ok = fitsAnywhere(p);
    const x0 = slotW * (i + .5) - (p.w * m) / 2;
    const y0 = L.trayY + L.trayH / 2 - (p.h * m) / 2;
    for (const [dr, dc] of p.cells) drawBlock(x0 + dc * m, y0 + dr * m, m, p.color, ok ? 1 : 0.3);
  });

  // dragged piece
  if (t) {
    const p = drag.piece;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 6;
    for (const [dr, dc] of p.cells) drawBlock(t.px + dc * cell, t.py + dr * cell, cell, p.color, 0.95);
    ctx.restore();
  }

  // particles
  particles = particles.filter(q => {
    q.x += q.vx; q.y += q.vy; q.vy += 0.35; q.life -= 0.022;
    if (q.life <= 0) return false;
    ctx.globalAlpha = q.life;
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
    ctx.globalAlpha = 1;
    return true;
  });

  // floating text
  floaters = floaters.filter(f => {
    const e = (now - f.t0) / 1100;
    if (e < 0) return true;
    if (e >= 1) return false;
    const pop = e < 0.15 ? 0.6 + e / 0.15 * 0.5 : 1.1 - Math.min(0.1, (e - 0.15));
    ctx.save();
    ctx.globalAlpha = e > 0.7 ? 1 - (e - 0.7) / 0.3 : 1;
    ctx.translate(f.x, f.y - e * cell * 0.8);
    ctx.scale(pop, pop);
    ctx.font = `${f.size}px "Lilita One", "Mitr", sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = f.size * 0.16; ctx.strokeStyle = "rgba(10,16,60,.85)"; ctx.lineJoin = "round";
    ctx.strokeText(f.text, 0, 0);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, 0, 0);
    ctx.restore();
    return true;
  });

  ctx.restore();

  // score count-up
  if (shownScore !== score) {
    shownScore += Math.max(1, Math.ceil((score - shownScore) * 0.15));
    if (shownScore > score) shownScore = score;
    scoreEl.textContent = shownScore.toLocaleString();
  }
  requestAnimationFrame(render);
}

/* ---------- input ---------- */
function pos(e) {
  const b = canvas.getBoundingClientRect();
  return { x: e.clientX - b.left, y: e.clientY - b.top };
}
canvas.addEventListener("pointerdown", e => {
  if (over || drag) return;
  const { x, y } = pos(e);
  if (y < L.trayY - L.cell * 0.3) return;
  const i = Math.min(2, Math.max(0, Math.floor(x / (L.W / 3))));
  if (!tray[i]) return;
  canvas.setPointerCapture(e.pointerId);
  const touch = e.pointerType !== "mouse";
  drag = { i, piece: tray[i], x, y, offY: touch ? L.cell * 2.2 : L.cell * 0.6, id: e.pointerId };
  sfx.pick();
});
canvas.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = pos(e);
  drag.x = p.x; drag.y = p.y;
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const t = dragTarget();
  const i = drag.i;
  drag = null;
  if (t && t.ok && e.type === "pointerup") place(i, t.r, t.c);
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

document.getElementById("restartBtn").addEventListener("click", newGame);
document.getElementById("playAgain").addEventListener("click", newGame);
document.getElementById("soundBtn").addEventListener("click", () => {
  soundOn = !soundOn;
  store("bb-sound", soundOn ? "1" : "0");
  drawSoundIcon();
});
addEventListener("resize", layout);

/* ---------- boot ---------- */
window.claude?.hot?.snapshot?.(() => ({ grid, tray, score, combo, movesSinceClear, over }));

function start(data) {
  best = parseInt(load("bb-best") || "0", 10) || 0;
  soundOn = load("bb-sound") !== "0";
  drawSoundIcon();
  layout();
  if (data && data.grid && data.tray) {
    grid = data.grid; tray = data.tray; score = data.score || 0; shownScore = score;
    combo = data.combo || 0; movesSinceClear = data.movesSinceClear || 0; over = !!data.over;
    scoreEl.textContent = score.toLocaleString();
    updateHud();
    if (over) showGameOver();
  } else {
    newGame();
  }
  if (document.fonts) document.fonts.ready.then(layout);
  requestAnimationFrame(render);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
